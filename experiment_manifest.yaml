# --- Study 6 order-axis special track + Study 7 / Study 5 authorization ---
study6_order_axis:
  diagnostic_date: "2026-08-11"
  artifacts: [reports/study6_order_diagnostic.md, results/study6/order_diagnostic.json,
    results/study6/order_probe.json]
  mechanism_findings: >
    (1) order enters representations for all trained systems; ~62-78% of raw
    score movement is rank-irrelevant common mode; centered noise ~0.29-0.33
    of within-set spread, similar across S2/S7/S8; (2) position-slot bias
    explains <8% of variance - the true cause is order-composition context
    drift under causal attention; (3) S8's advantage over S7 is attributable
    to the Sec 6.2 decomposition: halved h_i drift (cos 0.950 vs 0.816) and,
    decisively, the direction increment carried ~100% by the context-free
    monotone gate g_a(l) (increment noise ~1/6 of S7's).
  user_rulings_2026_08_11:
    - "(b) training-time permutation augmentation enters Study 7 as a NEW
      preregistered axis (H7-P)."
    - "(a) inference-time multi-permutation aggregation is NOT a formal
      evaluation axis; its offline K=5 estimates go into the discussion,
      attributed to Permutation Self-Consistency (Tang et al., NAACL 2024),
      with the residual-violation caveat (deployment mitigation, not a
      conclusion repair)."
    - "Mechanism findings above are designated paper material."
    - "4c seed-dependence limitation added to study6 report Sec 6 (per-seed
      diffs 0.0151/0.0020/0.0638)."
    - "Checkpoint backup deferred (user will handle separately);
      MIGRATION.md + environment/ locks stay as delivered."
