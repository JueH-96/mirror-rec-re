# Experiment manifest (RESEARCH_BRIEF §18.5)
go_no_go_decision:
  decision: GO
  decided_by: user (final ruling)
  date: "2026-07-28"
  basis: >
    All 8 §13.2 Go conditions met under user-confirmed thresholds
    (dvr_nontrivial>0.02, dvr_near_zero<0.01, parse_fail_max<0.10); zero §13.3
    No-Go conditions triggered. Conditions 1-4,8 from Study 1/2 main runs
    (reports/gonogo_report.md v2); conditions 5-7 from isotonic-projection
    pre-experiment on cached outputs (results/projection_results.json).
  study3_requirements_from_user:
    - post-hoc projection (baseline 12) is a mandatory strong baseline throughout;
      training-method value proposition targets scenarios where projection is
      unavailable/unreliable (unseen wording, unseen attributes, parser noise; bridges Study 4)
    - responsiveness monitored per §6.4 in all runs; DVR gains accompanied by RR
      collapse must be flagged (GLM low-magnitude-response pattern)
    - experiments/study3_plan.md requires user review BEFORE training starts (checkpoint)
    - continue: stage commits+push, call caching, failure retention, GPU 1 only

