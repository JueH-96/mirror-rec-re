# --- Study 3 / M2 (main matrix training) ---
study3_m2:
  completion_criterion: >
    M2 is complete ONLY when experiments/verify_m2_complete.py exits 0
    (all 24 runs in configs/study3/queue_order.txt have final.pt, 4 raw eval
    files with eligible*families*4 lines each, and 4 metrics parquets with
    eligible*families*3 rows each). The queue's M2_QUEUE_DONE marker is NOT
    trusted: on 2026-07-28 a disk-full cascade produced a spurious
    M2_QUEUE_DONE at 19:57:58 with 22/24 runs failed.
  deviations:
    - id: fat-checkpoint-disk-exhaustion
      date: "2026-07-28"
      type: infrastructure incident (no result data affected)
      timeline:
        - "pre-incident: train.py saved full model state_dicts (~16GB each,
          incl. frozen Llama-8B backbone); 4 fat checkpoints (S2 sanity +
          S2_llama_seed1042) filled the 3.7T disk"
        - "19:43 queue v1 started training S2_llama_seed1043; reached step
          250/3000 (loss logs preserved in
          experiments/study3/S2_llama_seed1043/train_log.attempt1_enospc.jsonl);
          the step-250 last.pt write hit ENOSPC and was truncated at 4.4GB;
          TRAIN_FAILED 19:57:42"
        - "19:57:42-19:57:58 the remaining 22 queue runs (positions 3-24)
          each failed instantly on ENOSPC; queue emitted a spurious
          M2_QUEUE_DONE at 19:57:58"
        - "recovery: deleted sanity checkpoints (+31G); extracted
          trainable-only weights from S2_llama_seed1042 final.pt
          (extract_trainable.py: 510.2MB, 452 tensors); removed redundant
          original/ weights from the HF Llama mirror cache; 78G free after"
        - "20:03 queue v2 relaunched; S2_llama_seed1043 immediately failed
          again (7s) loading the truncated last.pt (PytorchStreamReader:
          failed finding central directory); corrupt file removed, resume
          path hardened, run deferred to a catch-up queue pass"
      affected_runs: "queue positions 2-24 (S2_llama_seed1043 through
        S8_qwen_seed1042); S2_llama_seed1042 and all M0/M1 artifacts intact"
      s2_seed1042_checkpoint_extraction_verification: >
        Before deleting the 16GB original, spotcheck_ckpt.py loaded the
        510MB trainable-only checkpoint into a fresh RerankScorer and
        re-scored val chain levels against the recorded scores in
        results/study3/raw/S2_llama_seed1042/val.jsonl: max abs diff 0.0
        (bit-exact). SPOTCHECK PASS.
      s2_seed1043_retrain: >
        Trained FROM SCRATCH in the catch-up pass (no state reused from the
        interrupted attempt; the step-250 checkpoint was corrupt and
        discarded). Seed/config identical to the original plan, so the run
        is statistically equivalent to the other seeds; it differs only in
        wall-clock history (one discarded 250-step attempt, logs kept as
        train_log.attempt1_enospc.jsonl). No other run in the matrix has an
        interruption history.
      checkpoint_policy_change: >
        train.py commit after incident: (1) checkpoints now save only
        trainable params (LoRA adapters + score heads + monotone params,
        ~487MB on disk) via trainable_state(), never the frozen backbone;
        (2) last.pt is deleted once final.pt is written (per-run steady
        footprint 487MB vs 16GB before); (3) resume tolerates a corrupt
        last.pt by renaming it to .pt.corrupt (evidence retained) and
        training from scratch instead of crashing. Git: *.pt globally
        ignored; fat blobs never reached the remote (GitHub 100MB limit
        rejected the push); local history rewritten (reset --soft 525265f)
        before the clean push da8984f.
      git_state_after: "remote clean (git ls-files reports 0 *.pt); queue
        v2 auto-commits per completed run"
  review_decisions:
    date: "2026-07-31"
    decided_by: user (M2 main-matrix review)
    rulings:
      - "H3 preregistered verdict recorded as NOT SUPPORTED (effect-size
        condition met in only 1/5 comparisons: S7 vs S5). Must not be
        restated as partially/substantively supported. Floor effect
        (S2 already at 0.21% DVR, no 2pp headroom) may appear in the M3
        discussion ONLY as an explicitly labeled post-hoc explanation."
      - "M3 narrative re-centered on three empirical lines: (a) zero-shot
        directional violations are severe (20.4% llama / 10.9% qwen
        test_main) and prompt-unfixable (pilot); (b) relational-oracle
        supervision near-eliminates violations in-distribution, and
        directional objectives (S7/S8) hold zero DVR on unseen attributes
        where S2 degrades with seed instability; (c) the non-directional
        consistency regularizer (S5) backfires and triggers responsiveness
        collapse - directionality is a non-substitutable objective property."
      - "Parser-noise axis: EXECUTE per plan section 0/P2 (5/10/20 percent
        strength off-by-one / attribute-confusion injection); this is the
        key evidence axis for the S7/S8-vs-S1(projection) value proposition."
      - "Reinforced unseen-wording-family test: permitted but must be
        labeled exploratory (not preregistered) and excluded from the main
        evidence chain."
      - "New pre-M3 check required: per-system DVR decomposition on B-class
        (real-item) chains + score-margin distributions on test_main
        (results/study3/bclass_margin_report.json); stop for user review
        after this check, before M3 writing."
